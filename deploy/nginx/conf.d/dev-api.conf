server {
    listen 80;
    server_name dev-api.zipzip.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dev-api.zipzip.site;

    ssl_certificate     /etc/letsencrypt/live/api.zipzip.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zipzip.site/privkey.pem;

    # api-dev는 별도 compose 스택(docker-compose.dev.yml)에서 떠서 nginx와 시작 순서가
    # 보장되지 않는다. proxy_pass에 호스트명을 직접 쓰면 nginx가 설정 로드 시점에 upstream을
    # 해석하려다 컨테이너가 없으면 reload 자체가 실패한다. 변수 + resolver로 요청 시점에
    # 동적으로 해석하게 해서, api-dev가 잠깐 없어도 nginx는 안 죽고 502만 내려주게 한다.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $api_dev_upstream http://api-dev:8080;
        proxy_pass $api_dev_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
