spring:
  datasource:
    url: jdbc:h2:mem:zipzip_server_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

jwt:
  issuer: zipzip-server-test
  access-secret: test-access-secret-must-be-at-least-32-characters
  refresh-secret: test-refresh-secret-must-be-at-least-32-characters
  access-token-expiration: 30m
  refresh-token-expiration: 14d

apple:
  team-id: test-apple-team-id
  client-id: test-apple-client-id
  key-id: test-apple-key-id
  private-key: test-apple-private-key

idempotency:
  auth-response-encryption-key: test-idempotency-secret-must-be-at-least-32-characters
  auth-response-ttl: 10m
