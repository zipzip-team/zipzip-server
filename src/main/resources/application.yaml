server:
    forward-headers-strategy: framework

spring:
    config:
        import: classpath:config/application-secret.yml

    application:
        name: zipzip-server

    datasource:
        driver-class-name: org.postgresql.Driver

idempotency:
    auth-response-encryption-key: ${IDEMPOTENCY_AUTH_RESPONSE_ENCRYPTION_KEY:local-idempotency-response-encryption-key-change-me-32}
    auth-response-ttl: 10m
