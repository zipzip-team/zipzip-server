$kind: http-request
url: "{{baseUrl}}/api/v1/shared-groups/{{sharedGroupId}}"
method: DELETE
headers:
  Authorization: "Bearer {{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('공유 그룹 삭제 응답 상태가 200이다', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1800
