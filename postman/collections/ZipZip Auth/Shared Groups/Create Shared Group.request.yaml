$kind: http-request
url: "{{baseUrl}}/api/v1/shared-groups"
method: POST
headers:
  Authorization: "Bearer {{accessToken}}"
  Idempotency-Key: "{{$guid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "우리 집"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('공유 그룹 생성 응답 상태가 201이다', function () {
        pm.response.to.have.status(201);
      });

      const response = pm.response.json();
      if (response?.data?.id) {
        pm.collectionVariables.set('sharedGroupId', response.data.id);
      }
      if (response?.data?.inviteCode) {
        pm.collectionVariables.set('inviteCode', response.data.inviteCode);
      }
    language: text/javascript
order: 1100
