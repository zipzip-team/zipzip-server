$kind: http-request
url: "{{baseUrl}}/api/v1/shared-groups/{{sharedGroupId}}"
method: PATCH
headers:
  Authorization: "Bearer {{accessToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "여름 여행"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('공유 그룹 이름 수정 응답 상태가 200이다', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1300
