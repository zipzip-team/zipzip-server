$kind: http-request
url: "{{baseUrl}}/api/v1/shared-groups/{{sharedGroupId}}/members?size={{pageSize}}"
method: GET
headers:
  Authorization: "Bearer {{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('공유 그룹 멤버 목록 조회 응답 상태가 200이다', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1600
