$kind: http-request
url: "{{baseUrl}}/api/v1/users/me"
method: PATCH
headers:
  Authorization: "Bearer {{accessToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "displayName": "새 집집이"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('내 프로필 수정 응답 상태가 200이다', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1100
