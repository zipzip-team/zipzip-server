$kind: http-request
url: "{{baseUrl}}/api/v1/users/me"
method: DELETE
headers:
  Authorization: "Bearer {{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('사용자 탈퇴 응답 상태가 200이다', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1200
