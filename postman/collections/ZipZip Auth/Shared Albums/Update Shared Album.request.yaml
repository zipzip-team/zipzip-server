$kind: http-request
url: "{{baseUrl}}/api/v1/shared-albums/{{sharedAlbumId}}"
method: PATCH
headers:
  Authorization: "Bearer {{accessToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "제주 여름"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('공유집 이름 수정 응답 상태가 200이다', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1300
