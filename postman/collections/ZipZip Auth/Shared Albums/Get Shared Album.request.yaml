$kind: http-request
url: "{{baseUrl}}/api/v1/shared-albums/{{sharedAlbumId}}"
method: GET
headers:
  Authorization: "Bearer {{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('공유집 상세 조회 응답 상태가 200이다', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1200
