$kind: http-request
url: "{{baseUrl}}/api/v1/shared-albums/bulk-delete"
method: POST
headers:
  Authorization: "Bearer {{accessToken}}"
  Idempotency-Key: "{{$guid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sharedAlbumIds": ["{{sharedAlbumId}}"]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('공유집 일괄 삭제 응답 상태가 200이다', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1500
