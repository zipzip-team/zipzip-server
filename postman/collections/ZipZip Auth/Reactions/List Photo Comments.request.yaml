$kind: http-request
url: "{{baseUrl}}/api/v1/photos/{{photoId}}/comments?size={{pageSize}}"
method: GET
headers:
  Authorization: "Bearer {{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('사진 댓글 목록 조회 응답 상태가 200이다', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1300
