$kind: http-request
url: "{{baseUrl}}/api/v1/shared-groups/{{sharedGroupId}}/chat-messages"
method: POST
headers:
  Authorization: "Bearer {{accessToken}}"
  Idempotency-Key: "{{$guid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "content": "이번 여행 사진 올려줘!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('그룹 채팅 메시지 작성 응답 상태가 201이다', function () {
        pm.response.to.have.status(201);
      });
    language: text/javascript
order: 1100
