name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/zipzip-be

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # private 서브모듈(src/main/resources/config)이 체크아웃되지 않은 환경(CI/CD)에서도
      # non-optional classpath import가 깨지지 않도록 placeholder 값만 채운다.
      # 실제 프로덕션 DB 접속정보는 컨테이너 실행 시 SPRING_DATASOURCE_* 환경변수로 주입되어
      # 이 값을 덮어쓰므로(Spring 프로퍼티 우선순위상 env var가 우선), public 이미지에 포함되어도 안전하다.
      - name: Create build-time placeholder secret
        run: |
          mkdir -p src/main/resources/config
          cat > src/main/resources/config/application-secret.yml <<'YAML'
          spring:
            application:
              name: zipzip-server
            datasource:
              url: jdbc:postgresql://localhost:5432/placeholder
              username: placeholder
              password: placeholder
              driver-class-name: org.postgresql.Driver
          YAML

      # JAR은 러너 네이티브(x86) 아키텍처로 빌드한다. 바이트코드는 아키텍처 무관이라
      # 여기서 굳이 arm64를 QEMU로 에뮬레이션하며 컴파일할 필요가 없다(느림).
      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bootJar -x test
          mkdir -p app
          cp build/libs/*.jar app/app.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 인스턴스가 ARM64(Ampere A1)뿐이라 arm64 단일 아키텍처만 빌드한다.
      # 이 단계는 이미 빌드된 JAR을 arm64 JRE 이미지에 얹기만 하므로(COPY/chown)
      # QEMU 에뮬레이션이어도 빠르다 — 무거운 컴파일은 위에서 네이티브로 이미 끝남.
      - name: Build and push image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to zipzip-be
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GIT_SHA: ${{ github.sha }}
      DB_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      DB_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      DB_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ACCESS_TOKEN_EXPIRATION: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
      JWT_REFRESH_TOKEN_EXPIRATION: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}
    steps:
      - name: Validate deployment payload
        shell: bash
        run: |
          missing=0
          payload="$RUNNER_TEMP/zipzip-deployment.env"
          : > "$payload"
          chmod 600 "$payload"

          require_non_empty() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::$name is required for production deployment."
              missing=1
            fi
          }

          append_required_payload() {
            local key="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error::$key is required for production deployment."
              missing=1
              return
            fi

            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::$key must be stored as a single-line value for env_file delivery."
              missing=1
              return
            fi

            printf '%s=%s\n' "$key" "$value" >> "$payload"
          }

          require_non_empty SSH_USER "$SSH_USER"
          require_non_empty SSH_HOST "$SSH_HOST"
          require_non_empty SSH_PRIVATE_KEY "$SSH_PRIVATE_KEY"

          append_required_payload GIT_SHA "$GIT_SHA"
          append_required_payload SPRING_DATASOURCE_URL "$DB_URL"
          append_required_payload SPRING_DATASOURCE_USERNAME "$DB_USERNAME"
          append_required_payload SPRING_DATASOURCE_PASSWORD "$DB_PASSWORD"
          append_required_payload APPLE_TEAM_ID "$APPLE_TEAM_ID"
          append_required_payload APPLE_CLIENT_ID "$APPLE_CLIENT_ID"
          append_required_payload APPLE_KEY_ID "$APPLE_KEY_ID"
          append_required_payload APPLE_PRIVATE_KEY "$APPLE_PRIVATE_KEY"
          append_required_payload JWT_ISSUER "$JWT_ISSUER"
          append_required_payload JWT_SECRET "$JWT_SECRET"
          append_required_payload JWT_ACCESS_TOKEN_EXPIRATION "$JWT_ACCESS_TOKEN_EXPIRATION"
          append_required_payload JWT_REFRESH_TOKEN_EXPIRATION "$JWT_REFRESH_TOKEN_EXPIRATION"

          exit "$missing"

      # 시크릿은 run: 스크립트 문자열에 직접 넣지 않고 env:로만 전달한다.
      # ${{ secrets.X }}를 스크립트 본문에 직접 넣으면 GitHub Actions가 워크플로우 텍스트
      # 자체를 치환해버려서, 시크릿 값에 $(...)나 백틱이 섞여 있으면 그대로 셸 구문으로
      # 실행돼버릴 수 있다(스크립트 인젝션). env:로 넘기고 "$VAR"로 참조하면 값이 단순
      # 문자열 치환으로만 쓰여서 이 문제가 없다.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # 이미지는 public이라 서버에서도 로그인 없이 pull 가능.
      # 서버의 authorized_keys에 forced command(`~/zipzip-deploy.sh`)가 걸려 있어서
      # 실제로는 아래 커맨드 문자열('deploy')과 무관하게 그 스크립트만 실행된다.
      # 런타임 환경변수는 GitHub Secrets에 개별 등록해두고, stdin으로 흘려보내
      # 서버 스크립트가 그걸 그대로 zipzip-be.env로 기록한 뒤 배포하게 한다.
      # (forced command라 인자로 임의 데이터를 못 받으므로 stdin 경로를 씀)
      #
      # GIT_SHA도 함께 보내서, 서버가 이 커밋 시점의 deploy/docker-compose.yml,
      # deploy/nginx/conf.d/api.conf를 raw.githubusercontent.com에서 직접 가져와 반영하게
      # 한다(레포가 public이라 인증 불필요). 파일 내용을 stdin으로 직접 보내지 않는 이유:
      # 그러면 배포키가 유출됐을 때 임의 compose 설정(호스트 마운트, privileged 등)을
      # 주입당할 수 있어 위험이 커진다. GIT_SHA 방식은 실제 리뷰·머지된 커밋만 반영 가능하다.
      # 스크립트는 서버 ~/zipzip-deploy.sh, 구성 설명은 deploy/README.md 참고.
      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$SSH_USER@$SSH_HOST" 'deploy' < "$RUNNER_TEMP/zipzip-deployment.env"
